</style></head><body><div id="app"></div><div id=cam><video id=cv autoplay muted playsinline></video><div class=ph id=cph>Camera preview<br><small>Allow camera access to see yourself</small></div><div class=lb><span class=dot></span>Camera · sign here</div></div><script>(()=>{const v=document.getElementById('cv'),p=document.getElementById('cph');try{navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(s=>{v.srcObject=s;p.style.display='none'}).catch(()=>{})}catch(e){}})();</script><script>
const E=i=>document.getElementById(i);

let S={scr:'home',h:[],lang:'en',d:{},m:null,act:Date.now(),w:false,dis:false,to:0},tm=[];
const clr=()=>{tm.forEach(clearTimeout);tm=[]};

function track(k){S.d.step=0;S.d.k=k;[[2500,1],[6500,2]].forEach(([ms,n])=>tm.push(setTimeout(()=>{if(S.d.k==k){S.d.step=n;draw()}},ms)))}

const chips=(a,k,cur)=>a.map(x=>`<button class="ch ${cur==x?'on':''}" data-a=${k} data-v="${x}">${x}</button>`).join(' ');
const hd=()=>`<div class=hd><div><b>Chennai Egmore (MS)</b> <small>· Southern Railway · Kiosk K-03</small></div><div class=r>${['en','ta','hi'].map(l=>`<button class="ch ${S.lang==l?'on':''}" data-a=lang data-v=${l}>${{en:'EN',ta:'தமிழ்',hi:'हिं'}[l]}</button>`).join('')}<button class=ch data-a=fs aria-label="Larger text">A+</button><button class=sos data-a=sos>SOS – Alert staff</button></div></div>`;

const T0=Date.now(),mn=s=>+s.slice(0,2)*60+ +s.slice(3),now=()=>(18*60+30+Math.floor((Date.now()-T0)/60000))%1440,clk=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');

home:()=>`<h1>${WL[S.lang]}</h1><div class=tl>${['train','where','help'].map((k,i)=>`<button class="t ${k=='help'?'rd':''}" data-a=go data-v=${k}><span>${IC[k]}</span>${L[S.lang][i]}<small> ISL sign: ${k.toUpperCase()}</small></button>`).join('')}</div>`,
train:()=>{const d=S.d;return `<h2>${IC.train} Trains from Egmore <small>(demo data)</small></h2><div class=tabs>${[['board','Train board'],['my','My train / Route']].map(([k,n])=>`<button class="ch ${d.tab==k?'on':''}" data-a=tab data-v=${k}>${n}</button>`).join('')}</div>`+(d.tab=='board'?`<input id=q list=dl placeholder="Type destination or train name… (Madurai, Trichy)" value="${d.q||''}" autocomplete=off><datalist id=dl>${[...new Set(TR.map(x=>x[2]))].map(x=>`<option value="${x}">`).join('')}</datalist><div class=card><table><thead><tr><th>Code<th>Train<th>To<th>Dep<th>Plat<th>Status</thead><tbody id=tb>${rows(d.q||'')}</tbody></table></div><small>Tap a train for platform, coach position, route and alerts.</small>`:`<p>Enter train number (5 digits) or PNR (10 digits)</p><div class=row><input id=tn inputmode=numeric maxlength=10 placeholder="e.g. 12637"><button class=btn data-a=find>Show</button></div><p class=er id=er></p>`)},
td:()=>{const r=TR.find(x=>x[0]==S.d.c),st=['Chennai Egmore','Tambaram','Villupuram','Tiruchirappalli',r[2]].filter((v,i,a)=>a.indexOf(v)==i);return `<h2>${r[0]} · ${r[1]}</h2><div class=g2><div class=card><div class=big>Platform ${r[4]}</div><p class=${wc(r[5])}>${r[5]=='Platform changed'?'Platform changed – check the board':r[5]}</p><p>Departs ${r[3]} · To ${r[2]}</p><b>Coach position (demo)</b><div class=co>${['ENG','GS','S1','S2','S3','S4','B1','B2','A1','H1','GS','SLR'].map(c=>`<i>${c}</i>`).join('')}</div><small>◀ Engine end is toward the Platform 1 side</small></div><div class=card><b>Route (demo)</b><ol>${st.map(s=>`<li>${s}`).join('')}</ol></div></div><div class=card><b>SMS / WhatsApp alerts</b> for platform changes and delays<div class=row><input type=tel id=ph inputmode=tel maxlength=10 placeholder="10-digit mobile"><label><input type=checkbox id=cs> I consent</label><button class=btn data-a=sub>Alert me</button></div><p id=er class=er></p></div>`},
where:()=>`<h2>${IC.where} Where do you want to go?</h2><div class=row><button class="ch ${S.w?'on':''}" data-a=acc> Step-free route: ${S.w?'ON':'OFF'}</button></div><div class=tl style="margin-top:12px">${['lift','escalator','washroom','exit'].map(k=>`<button class=t data-a=to data-v=${k}><span>${IC[k]}</span>${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>`,
map:()=>{let k=S.d.to,n='';if(k=='escalator'&&S.w){k='lift';n='<p class=wn> Step-free mode is on: escalator is not accessible, showing the lift.</p>'}const p=P[k];return `<h2>${IC[k]} Route to ${k}</h2>${n}<div class=g2><div class=card>${svg(p)}<small>L Lift · E Escalator · W Washroom · X Exit (demo layout)</small></div><div class=card><b>Directions</b><ol>${ST[k].map(s=>`<li>${s}`).join('')}</ol><p>≈ ${p.length*20} m · about ${p.length*15} sec</p></div></div>`},
help:()=>`<h2>${IC.help} What do you need?</h2><div class=tl>${['medical','security','lost'].map(k=>`<button class="t ${k!='lost'?'rd':''}" data-a=go data-v=${k}><span>${IC[k]}</span>${k[0].toUpperCase()+k.slice(1)}<small> ISL sign: ${k.toUpperCase()}</small></button>`).join('')}</div>`,
medical:()=>{const d=S.d;return `<h2>${IC.medical} Medical alert sent</h2><p class=ok><b>Staff have your location:</b> Egmore · Concourse · Kiosk K-03</p>${trk(['Alert received','Staff on the way','Staff arrived'],d.step||0)}<div class=card><b>Help is coming. Stay where you are.</b><br>${d.more?'<span class=er>Extra help (ambulance) has been requested.</span>':''}</div><div class=card><b>Optional: where is the problem?</b><br>${chips(['Head','Chest','Stomach','Arm','Leg','Not sure'],'body',d.body)}</div><div class=row><button class=btn data-a=more>I need more help</button>${d.cf?`<span>Cancel the alert? <button class=ch data-a=cxy>Yes, cancel</button> <button class=ch data-a=cxn>No</button></span>`:'<button class=ch data-a=cx>I’m okay – cancel alert</button>'}</div>`},
security:()=>{const d=S.d;if(!d.sent)return `<h2>${IC.security} Security</h2><p>A silent alert goes to security. Nothing loud will happen here.</p><label><input type=checkbox ${S.dis?'checked':''} data-a=dis> Discreet mode (neutral screen text)</label><div class=tl style="margin-top:12px">${['Being followed','Harassment','Theft','Unsafe person nearby','Other'].map(x=>`<button class=t style="min-height:90px;font-size:1.2em" data-a=sec data-v="${x}">${x}</button>`).join('')}</div>`;return `<h2>${S.dis?'Request received':'${IC.security} Security alert sent silently'}</h2><p class=ok>Location: Egmore · Concourse · Kiosk K-03</p>${trk(S.dis?['Received','Coming','Here']:['Alert received','Security on the way','Security arrived'],d.step||0)}<p>${S.dis?'Please wait here.':'Stay in a well-lit, busy spot if you can.'}</p><div class=row><button class=btn data-a=more>I need further help</button><button class=ch data-a=hide>Quick hide screen</button><button class=ch data-a=home>I’m safe – done</button></div>${d.more?'<p class=er>RPF has been asked to come urgently.</p>':''}`},
lost:()=>`<h2>${IC.lost} What is lost?</h2><div class=tl><button class=t data-a=lp><span>${IC.person}</span>A person<small>my companion</small></button><button class=t data-a=li><span>${IC.item}</span>An item<small>bag, phone, documents…</small></button></div>`,
lostp:()=>{const d=S.d,v=f();if(d.sent)return `<h2> Report received</h2>${trk(['Report received','Staff approved announcement','Announcement made'],d.step||0)}<div class=card><b>Announcement text (staff-approved)</b><p>“${v.n}, ${v.a} years, ${v.d||'no description'}: your companion is waiting at ${v.w||'the Platform 1 bench'}. Please go to them.”</p>${d.step==1?'<p class=warn>Announcement in progress…</p>':d.step==2?'<p class=ok>Announced at '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</p>':''}</div>${v.dk?`<div class=board>MESSAGE FOR ${(v.n||'').toUpperCase()}: YOUR COMPANION IS AT ${(v.w||'PLATFORM 1 BENCH').toUpperCase()} · SHOWN ON ALL KIOSKS &amp; LED BOARDS</div>`:''}<div class=row style="margin-top:12px"><button class=btn data-a=arr> My companion has arrived</button><button class=ch data-a=go data-v=help>I need further help</button></div>`;return `<h2>${IC.person} Lost person</h2><div class=g2><div><input data-f=n placeholder="Name of lost person" value="${v.n||''}"><input data-f=a inputmode=numeric placeholder="Age" value="${v.a||''}"><input data-f=d placeholder="Clothes / description" value="${v.d||''}"><select data-f=w><option value="">Where will you wait?<option>Platform 1 bench<option>Main entrance<option>Enquiry counter</select><label><input type=checkbox data-f=dk ${v.dk?'checked':''}> The lost person is deaf / hard of hearing</label></div><div class=card><b>Tap the map where you last saw them</b>${'<div id=mw>'+svg(null,d.pin)+'</div>'}</div></div><p class=er id=er></p><button class=btn data-a=subp>Send to staff</button>`},
losti:()=>{const d=S.d,v=f();if(d.sent)return `<h2>Report submitted</h2><div class=card><p>Reference <b>LI-2043</b>. We will message you if it is found.</p><div class=co><i>QR</i></div><small>Scan to add photos from your phone</small></div><button class=btn data-a=home>Done</button>`;return `<h2>${IC.item} Lost item</h2><b>Category</b><br>${chips(['Bag','Phone','Wallet','Documents','Other'],'cat',v.cat)}<input data-f=c placeholder="Colour / brand" value="${v.c||''}"><input data-f=t placeholder="Train number / coach (optional)" value="${v.t||''}"><input data-f=d placeholder="Describe the item" value="${v.d||''}"><input data-f=ct placeholder="Phone or email for updates (optional)" value="${v.ct||''}"><label><input type=checkbox data-f=cs ${v.cs?'checked':''}> I consent to being contacted</label><p class=er id=er></p><button class=btn data-a=subi>Submit report</button>`},
sos:()=>{const d=S.d;return `<h2>${IC.alert} Alert sent to station staff</h2><p class=ok><b>Staff have your location:</b> Egmore · Concourse · Kiosk K-03</p>${trk(['Alert received','Staff on the way','Staff arrived'],d.step||0)}<div class=card><b>Help is coming. Stay where you are.</b></div><div class=card><b>Optional: tell staff what kind of help you need</b><br>${chips(['Medical','Security','Lost person','Other'],'kind',d.kind)}${d.kind?'<p class=ok>Staff have been told: '+d.kind+'.</p>':''}</div><div class=row><button class=btn data-a=more>I need more help</button>${d.cf?`<span>Cancel the alert? <button class=ch data-a=cxy>Yes, cancel</button> <button class=ch data-a=cxn>No</button></span>`:'<button class=ch data-a=cx>I’m okay – cancel alert</button>'}${d.more?'<span class=er>Extra staff have been called.</span>':''}</div>`},
train:()=>`<h2>${IC.train} Train information</h2><div class=tl>${[['when','When','Upcoming trains'],['dest','Destination','Trains to a place'],['route','Route','Stops of a train']].map(([k,n,s])=>`<button class=t data-a=go data-v=${k}><span>${IC[k]}</span>${n}<small>${s} · ISL sign: ${n.toUpperCase()}</small></button>`).join('')}</div>`,
when:()=>`<h2>${IC.when} Upcoming trains</h2><p class=mu>Station time ${clk(now())} (demo) · trains yet to depart, earliest first</p>${tbl(up())}`,
dest:()=>{const d=S.d;return `<h2>${IC.dest} Trains by destination</h2>`+(d.p?`<div class=row><b>Destination: ${d.p}</b><button class=ch data-a=chg>Change</button></div>${tbl(up().filter(x=>x[2]==d.p))}`:`<input id=dq placeholder="Type to search destinations" autocomplete=off><div class=card id=dl2>${dl('')}</div>`)},
route:()=>{const d=S.d,r=TR.find(x=>x[0]==d.c);return `<h2>${IC.route} Train route</h2><p class=mu>Type a train name or number, or select one below.</p><input id=rq placeholder="Train name or number (e.g. 12637 or Pandian)" value="${d.q||''}" autocomplete=off><div class=card id=rs>${rl(d.q,d.c)}</div>${r?rmap(r):''}`},
done:()=>`<div class=card style="text-align:center"><h2>${S.d.m}</h2><button class=btn data-a=home>Home</button></div>`};
function draw(){E('app').innerHTML=hd()+nav()+`<main>${V[S.scr]()}</main>`+sim()+modal()}
function run(s){S.m=null;({train:()=>go('train'),when:()=>go('when'),destination:()=>go('dest'),route:()=>go('route'),where:()=>go('where'),help:()=>go('help'),medical:()=>{go('medical');track('med')},security:()=>go('security'),lost:()=>go('lost'),back:back,cancel:home})[s]()}
const er=m=>{E('er').textContent=m};
const A={lang:v=>{S.lang=v;draw()},go:v=>{go(v,v=='train'?{tab:'board',q:''}:{});if(v=='medical')track('med')},sos:()=>{go('sos');track('sos')},kind:v=>{S.d.kind=v;draw()},home,back,tab:v=>{S.d={tab:v,q:''};draw()},td:v=>go('td',{c:v}),
find:()=>{const v=E('tn').value.trim(),r=/^\d{5}$/.test(v)?TR.find(x=>x[0]==v):/^\d{10}$/.test(v)?TR[6]:null;r?go('td',{c:r[0]}):er('Not found. Enter a 5-digit train number or a 10-digit PNR.')},
sub:()=>{if(!/^[6-9]\d{9}$/.test(E('ph').value))return er('Enter a valid 10-digit mobile number.');if(!E('cs').checked)return er('Please tick consent to receive alerts.');E('er').className='ok';er('Alerts on. We will SMS you about platform or delay changes.')},
acc:()=>{S.w=!S.w;draw()},pick:v=>{S.d.p=v;draw()},chg:()=>{S.d.p='';draw()},rt:v=>{S.d.c=v;draw()},fs:()=>{S.fs=!S.fs;document.body.style.fontSize=S.fs?'22px':''},to:v=>go('map',{to:v}),body:v=>{S.d.body=v;draw()},more:()=>{S.d.more=1;draw()},cx:()=>{S.d.cf=1;draw()},cxn:()=>{S.d.cf=0;draw()},cxy:()=>done('Alert cancelled. Stay safe.'),
dis:()=>{S.dis=!S.dis;draw()},sec:v=>{S.d.sent=v;track('sec');draw()},hide:()=>home(),lp:()=>go('lostp',{f:{}}),li:()=>go('losti',{f:{}}),
subp:()=>{const v=f();if(!v.n||!v.a)return er('Please enter name and age.');if(!/^\d{1,3}$/.test(v.a))return er('Age must be a number.');if(!S.d.pin)return er('Tap the map to mark where you last saw them.');S.d.sent=1;track('lost');draw()},
cat:v=>{S.d.f.cat=v;draw()},subi:()=>{const v=f();if(!v.cat)return er('Please choose a category.');if(v.ct&&!(/^[6-9]\d{9}$/.test(v.ct)||/^\S+@\S+\.\S+$/.test(v.ct)))return er('Enter a valid phone number or email.');if(v.ct&&!v.cs)return er('Please tick consent to be contacted.');S.d.sent=1;draw()},
arr:()=>done('Glad you are reunited. The announcement has been stopped.'),sg:v=>run(v),sy:()=>run(S.m),sn:()=>{S.m=null;draw()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v);const m=e.target.closest('#mp');if(m&&S.scr=='lostp'&&!S.d.sent){const r=m.getBoundingClientRect();S.d.pin=[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*300/r.height];E('mw').innerHTML=svg(null,S.d.pin)}});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.f;if(k&&S.d.f)S.d.f[k]=t.type=='checkbox'?t.checked:t.value;if(t.id=='dq'){E('dl2').innerHTML=dl(t.value)}if(t.id=='rq'){const q=t.value.trim().toLowerCase(),l=TR.filter(x=>(x[0]+' '+x[1]+' '+x[2]).toLowerCase().includes(q));S.d.q=t.value;E('rs').innerHTML=rl(t.value,S.d.c);if(q.length>=3&&l.length==1&&S.d.c!=l[0][0]){S.d.c=l[0][0];draw();E('rq').focus()}}});
document.addEventListener('pointerdown',()=>{S.act=Date.now();if(S.to){S.to=0;draw()}});
setInterval(()=>{const i=(Date.now()-S.act)/1000;if(['idle','home','medical','sos'].includes(S.scr))return;if(i>45&&!S.to){S.to=1;draw()}if(S.to&&i>55){S.to=0;S.h=[];S.scr='home';S.d={};clr();draw()}},1000);
draw();
</script></body></html>
