<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Egmore ISL Kiosk — SignMeet</title>
  <meta name="description" content="Chennai Egmore Railway Station ISL sign-language assistance kiosk">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚉</text></svg>">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- ── Main application container ── -->
  <div id="app"></div>

  <!-- ── Floating camera container with live HUD ── -->
  <div id="cam-container">
    <!-- Live Recognized Sign HUD (above camera) -->
    <div id="cam-hud" class="cam-hud">
      <div class="hud-top-row">
        <span class="hud-status-dot" id="hud-dot"></span>
        <span class="hud-sign-label" id="hud-sign">Ready to sign...</span>
        <span class="hud-pct-badge" id="hud-pct">0.0%</span>
      </div>
      <div class="hud-progress-track">
        <div class="hud-progress-fill" id="hud-bar" style="width: 0%"></div>
      </div>
      <div class="hud-sub-info">
        <span id="hud-thresh">Req: 60%</span>
        <span id="hud-alts"></span>
      </div>
    </div>

    <div id="cam">
      <img id="cam-feed"
           src="http://localhost:8766/video_feed"
           alt="Live sign recognition camera feed"
           style="display:none">
      <div class="ph" id="cam-placeholder">
        Camera preview<br>
        <small>Start the Python service to see yourself</small>
      </div>
      <div class="lb">
        <span class="dot" id="cam-dot"></span>
        <span id="cam-label">Camera · sign here</span>
      </div>
    </div>
  </div>

  <!-- ── Scripts (order matters) ── -->
  <script src="js/state.js"></script>
  <script src="js/ws_client.js"></script>
  <script src="js/intent_router.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
